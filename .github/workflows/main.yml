name: Build AyuGram APK

on:
  push:
    branches: [ rewrite ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Strip proprietary submodule and pull the rest
        run: |
          python3 - <<'EOF'
          import re
          text = open('.gitmodules').read()
          text = re.sub(
              r'\[submodule "[^"]*"\]\s*\n\s*path\s*=\s*[^\n]*proprietary[^\n]*\n\s*url\s*=\s*[^\n]*\n',
              '', text
          )
          open('.gitmodules', 'w').write(text)
          EOF
          git submodule sync
          git submodule update --init --recursive --depth 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleAfatDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-AI-Translate
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
