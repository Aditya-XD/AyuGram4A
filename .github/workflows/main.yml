name: Build AyuGram APK

on:
  push:
    branches: [ main, rewrite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Remove proprietary submodule and init the rest
        run: |
          python3 -c "
import re
content = open('.gitmodules').read()
content = re.sub(r'\[submodule [^\]]*proprietary[^\]]*\][^\[]*', '', content)
open('.gitmodules', 'w').write(content)
print('Cleaned .gitmodules')
print(open('.gitmodules').read())
"
          git submodule sync
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build APK
        run: ./gradlew assembleAfatDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-AI-Translate
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 7
