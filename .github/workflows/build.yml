name: Build AyuGram APK

on:
  push:
    branches: [ rewrite ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo manually
        run: |
          git clone \
            --depth 1 \
            --branch rewrite \
            --no-recurse-submodules \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
            .

      - name: Init submodules except proprietary
        run: |
          PROP_PATH="TMessagesProj/src/main/java/com/radolyn/ayugram/proprietary"

          # Get all submodule paths from .gitmodules, skip proprietary
          python3 - <<'EOF'
          import configparser, subprocess
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for section in c.sections():
              path = c[section].get('path', '')
              if 'proprietary' in path:
                  print(f"Skipping: {path}")
                  continue
              print(f"Updating: {path}")
              subprocess.run(
                  ['git', 'submodule', 'update', '--init', '--recursive', '--depth', '1', '--', path],
                  check=True
              )
          EOF

          # Stub out the proprietary directory so Java package exists
          mkdir -p "$PROP_PATH"
          echo "Done. Proprietary stubbed at $PROP_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Make gradlew executable
        run: chmod +x gradlew

        
      - name: Create API keys
        run: |
          cat > local.properties << 'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          APP_ID=6
          APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e
          MAPS_V2_API=AIzaSyDSBiDfHFurzp3RGqOF6-VPxjJqdMzrHI0
          SIGNING_KEY_PASSWORD=password
          SIGNING_KEY_ALIAS=key0
          SIGNING_KEY_STORE_PASSWORD=password
          EOF

          
      - name: Build debug APK
        run: ./gradlew assembleAfatDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-AI-Translate
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
