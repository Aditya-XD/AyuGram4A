name: Build AyuGram APK

on:
  push:
    branches: [ rewrite ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo manually
        run: |
          git clone \
            --depth 1 \
            --branch rewrite \
            --no-recurse-submodules \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
            .

      - name: Init submodules except proprietary
        run: |
          PROP_PATH="TMessagesProj/src/main/java/com/radolyn/ayugram/proprietary"
          python3 - <<'PYEOF'
          import configparser, subprocess
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for section in c.sections():
              path = c[section].get('path', '')
              if 'proprietary' in path:
                  print(f"Skipping: {path}")
                  continue
              print(f"Updating: {path}")
              subprocess.run(
                  ['git', 'submodule', 'update', '--init', '--recursive', '--depth', '1', '--', path],
                  check=True
              )
          PYEOF
          mkdir -p "$PROP_PATH"
          echo "Done."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create API keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API }}
        run: |
          printf "APP_ID=%s\nAPP_HASH=%s\nMAPS_V2_API=%s\n" \
            "$APP_ID" "$APP_HASH" "$MAPS_V2_API" > API_KEYS
          echo "API_KEYS written"

      - name: Build APK
        run: |
          ./gradlew :TMessagesProj:assembleBetaDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-AI-Translate
          path: TMessagesProj/build/outputs/apk/beta/debug/*.apk
          if-no-files-found: error
          retention-days: 7
